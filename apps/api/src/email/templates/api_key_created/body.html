<div class="wrap">
  <div class="card">
    <div class="accent accent-indigo"></div>
    <table
      role="presentation"
      class="masthead"
      cellspacing="0"
      cellpadding="0"
      border="0"
      style="border-bottom: 1px solid #e2e8f0; width: 100%; border-collapse: collapse"
    >
      <tr>
        <td style="padding: 20px 0 20px 28px; width: 38px; vertical-align: middle; line-height: 0">
          <span
            style="
              display: inline-block;
              width: 28px;
              height: 28px;
              border-radius: 7px;
              background: #4f46e5;
              color: #ffffff;
              font-family: Georgia, 'Source Serif 4', serif;
              font-weight: 600;
              font-size: 16px;
              text-align: center;
              line-height: 28px;
              vertical-align: middle;
              text-decoration: none;
            "
            >S</span
          >
        </td>
        <td
          style="
            padding: 20px 28px 20px 10px;
            vertical-align: middle;
            font-family:
              Source Serif 4,
              Georgia,
              serif;
            font-weight: 500;
            font-size: 18px;
            color: #0b1220;
            letter-spacing: -0.01em;
          "
        >
          Seald
        </td>
      </tr>
    </table>
    <div class="body">
      <span class="kicker">New key</span>
      <h1>{{key_name}}</h1>
      <p>A key named {{key_name}} was created on your account.</p>
      <p>Prefix: <code>{{key_prefix}}</code></p>
      <p class="muted">If you did not create it, revoke it in Settings.</p>
      <table
        role="presentation"
        cellspacing="0"
        cellpadding="0"
        border="0"
        style="margin-top: 18px; border-collapse: separate"
      >
        <tr>
          <td>
            <a
              href="{{settings_url}}"
              class="cta cta-primary"
              target="_blank"
              rel="noopener noreferrer"
              style="
                display: inline-block;
                padding: 10px 18px;
                background: #0b1220;
                color: #ffffff !important;
                text-decoration: none !important;
                border: 1px solid #0b1220;
                border-radius: 10px;
                font-weight: 600;
                font-size: 14px;
                line-height: 1.2;
                letter-spacing: -0.005em;
                margin: 0;
              "
              >Open Settings</a
            >
          </td>
        </tr>
      </table>
    </div>
    <div class="foot">
      <strong style="color: #1f2937">{{legal_entity}}</strong> · {{legal_postal}}<br />
      <a href="{{public_url}}">{{public_url}}</a> · <a href="{{privacy_url}}">Privacy</a> ·
      <a href="{{preferences_url}}">Questions about these emails</a>
    </div>
  </div>
</div>
