name: Supabase keep-alive (health ping)

# docs/aws-exit-plan.md WS-8: Supabase Free pauses a project after 7 days
# without activity. Ping the bridge /health daily as a backstop and fail
# (so GitHub emails the owner) when it does not answer 200.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /health
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::SUPABASE_PROJECT_REF not set; skipping"
            exit 0
          fi
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/seald/health"
          for _ in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url")
            [ "$code" = "200" ] && echo "healthy" && exit 0
            sleep 20
          done
          echo "::error::Supabase bridge /health answered $code"
          exit 1
