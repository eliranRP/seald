name: Playwright

# Browser e2e tests for apps/web. Lives in its own workflow so it can iterate
# without colliding with the main CI matrix in ci.yml. The signing flow is
# the most user-facing happy path in the product and previously had ZERO
# browser coverage — vitest unit tests run in jsdom and miss real-browser
# regressions (CSS-in-JS hydration, react-router lazy boundaries, etc.).

on:
  # PRs and pushes to main use paths-ignore so docs-only diffs do not
  # start this workflow. Each browser job is also guarded by the
  # `changes` filter below, so backend-only PRs report SKIPPED checks
  # (which `Playwright Success` passes as success-or-skip) instead of
  # producing no checks at all. The nightly schedule and
  # workflow_dispatch bypass that filter and run the suite on main.
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'Design-Guide/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'Design-Guide/**'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  # Nightly on main, including when recent commits are docs-only
  # (those pushes are paths-ignored). The minute is offset from :00
  # so this does not land on the same instant as every other 03:00 cron.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

# Browser e2e — read-only: checkout source, install browsers, run
# tests, upload report artifacts. No GITHUB_TOKEN write needed.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Path filter — browser jobs run when the SPA (including e2e), the
  # shared package, or the lockfile changes. Pushes to main, the nightly
  # schedule, and workflow_dispatch bypass the filter.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/playwright.yml'

  e2e-web:
    name: Web e2e (Playwright + Chromium)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter shared build

      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm --filter web e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------
  # BDD-driven Playwright suite (playwright-bdd). PRs run the @smoke
  # subset for fast feedback; main pushes run the full suite. See
  # apps/web/e2e/features/*.feature for the scenario inventory and
  # ~/.claude/skills/web-bdd-implementation/SKILL.md for the playbook.
  # ---------------------------------------------------------------
  bdd-e2e:
    name: BDD e2e (web)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.web == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Cache pnpm store + node_modules
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/pnpm/store
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build shared
        run: pnpm --filter shared build
      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run BDD smoke (PR)
        # Dedicated scripts (bdd:smoke / bdd:full) avoid `pnpm … -- --grep`
        # which passes `--` to playwright as a literal file pattern,
        # producing "No tests found".
        if: github.event_name == 'pull_request'
        run: pnpm --filter web bdd:smoke

      - name: Run BDD full suite (push, schedule, or dispatch)
        if: github.event_name != 'pull_request'
        run: pnpm --filter web bdd:full

      - name: Upload BDD Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bdd-playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # Aggregator job: succeeds if every upstream playwright job is success
  # or skipped. Branch protection points at this single job so backend-
  # only PRs (where e2e-web + bdd-e2e are SKIPPED via the changes filter)
  # can still satisfy the required-status-checks gate.
  playwright-success:
    name: Playwright Success
    runs-on: ubuntu-latest
    needs: [e2e-web, bdd-e2e]
    if: always()
    steps:
      - name: Verify all required playwright jobs passed (or were skipped)
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "Upstream results: $results"
          if [[ "$results" == *failure* ]]; then
            echo "::error::One or more upstream playwright jobs failed"
            exit 1
          fi
          if [[ "$results" == *cancelled* ]]; then
            echo "::error::One or more upstream playwright jobs were cancelled"
            exit 1
          fi
          echo "All upstream playwright jobs succeeded or were skipped — gate passes."
