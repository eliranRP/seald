version: 2

# One root npm entry for the whole pnpm workspace (pnpm-workspace.yaml covers
# apps/* and packages/*), so every Dependabot PR refreshes the single root
# pnpm-lock.yaml. Minor/patch bumps are grouped; majors open their own PRs
# because they need human review.
#
# Commit messages use a lowercase conventional prefix so they pass Commitlint
# (@commitlint/config-conventional), e.g. "chore(deps): bump x from 1 to 2".

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # playwright-bdd 8.x crashes on @playwright/test >= 1.64.
      - dependency-name: "@playwright/test"
        versions: [">=1.61.0"]
      - dependency-name: "playwright"
        versions: [">=1.61.0"]
      # @react-pdf/renderer >= 4.7 pulls in @react-pdf/textkit 7, whose
      # @react-pdf/hyphenate/en-us subpath jest can't resolve (breaks the
      # sealing/audit-PDF suites). 4.6.x still uses textkit 6.
      - dependency-name: "@react-pdf/renderer"
        versions: [">=4.7.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    groups:
      gh-actions:
        patterns: ["*"]
