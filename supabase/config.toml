# Supabase CLI config for the Seald Edge Functions
# (docs/supabase-native-architecture.md). Used by `supabase functions deploy`
# in .github/workflows/deploy-supabase.yml; the database schema is applied by
# apps/api/scripts/migrate.sh, not by `supabase db push`.
#
# Every function does its own authentication (Supabase JWT, signer session,
# API key, or X-Cron-Secret), so the gateway's JWT check is off. Each
# function's dist/ is generated by `pnpm --filter api build:edge`.

project_id = "seald"

[functions.seald]
verify_jwt = false
entrypoint = "./functions/seald/index.ts"

[functions.seal-worker]
verify_jwt = false
entrypoint = "./functions/seal-worker/index.ts"

[functions.email-worker]
verify_jwt = false
entrypoint = "./functions/email-worker/index.ts"
