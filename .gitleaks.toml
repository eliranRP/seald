# Gitleaks configuration for seald monorepo
# https://github.com/gitleaks/gitleaks#configuration

title = "seald gitleaks config"

[extend]
useDefault = true

# Paths to ignore during scanning
[allowlist]
paths = [
  '''node_modules/''',
  '''pnpm-lock\.yaml''',
  '''dist/''',
  '''\.next/''',
  '''coverage/''',
  '''\.env\.local\.example''',
  '''apps/api/test/''',
  '''\.storybook/''',
]

# Live agent keys. 32 bytes of base64url plus an 8-hex checksum.
# This does not register the prefix with GitHub secret scanning.
[[rules]]
id = "seald-live-api-key"
description = "Seald live API key"
regex = '''seald_live_[A-Za-z0-9_-]{43}[0-9a-f]{8}'''

# Known test/placeholder values that are not real secrets
[[rules]]
id = "placeholder-supabase-key"
description = "Placeholder Supabase key in example env files"
regex = '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZS1kZW1v'''
[rules.allowlist]
regexTarget = "match"
regexes = ['''.*''']
